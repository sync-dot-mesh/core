[workspace]
changelog_config = "cliff.toml"

# Update Cargo.lock too, not just Cargo.toml
dependencies_update = false

git_tag_enable = true
git_release_enable = true

# Off for every crate in the workspace by default — everything here is
# an internal component (the engine, the wire contract, the daemon
# binary, test tooling), not something meant to be `cargo add`-ed
# externally yet. A workspace-level default rather than a per-package
# `[[package]]` override specifically so this never goes stale again
# when a crate is added, renamed, or split — the previous config named
# a single crate (`sync-mesh-core`) that stopped existing the moment
# the workspace restructure landed, and release-plz failed outright
# because of it. If one specific crate should be published later,
# override it explicitly with its own `[[package]]` block at that
# point, rather than flip this default.
publish = false
