[workspace]
resolver = "2"
members = [
    "crates/engine",
    "crates/proto",
    "crates/daemon",
    "crates/testkit",
]

# Shared metadata — inherited by member crates via `.workspace = true`
[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "time", "fs", "process"] }
tonic = "0.12"
prost = "0.13"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[profile.dev]
debug = 1
split-debuginfo = "unpacked"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
